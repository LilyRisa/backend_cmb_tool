server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Matches SrtGenerateController's 60MB upload limit (the largest of the
    # AI-tool uploads) plus headroom.
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /transcribe, /translate, generate-script/-scenes/-image are synchronous
    # endpoints that call an AI provider directly (no queue) and can legitimately
    # take minutes for chunked generation — keep nginx's and php-fpm's timeouts
    # generous rather than tight.
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
