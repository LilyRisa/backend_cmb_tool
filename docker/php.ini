; Matches nginx.conf's client_max_body_size and the generous timeouts needed
; by synchronous AI-tool endpoints (see nginx.conf's comment).
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Production opcache — validate_timestamps=0 means code changes require a
; container restart to take effect, which is the correct trade-off here since
; every deploy already restarts the containers.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
